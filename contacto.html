<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Katalina Alvarado</title>
    <!-- Mismo archivo CSS que index.html -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Tipografía desde Google Fonts (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="card">
        <!-- Menú de Navegación Superior -->
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="contacto.html" class="active">Contacto</a>
        </nav>

        <div class="contact-container">
            <h1 class="name">Contacto</h1>
            <p class="subtitle">¿Tienes un proyecto o consulta? ¡Escríbeme!</p>
            <hr class="divider">

            <p class="bio">
                ¿Estás interesado en mis proyectos o estrategias? Contáctame a través del siguiente formulario y te responderé a la brevedad.
            </p>

            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="username">Nombre Completo:</label>
                    <input type="text" id="username" name="username" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar mensaje</button>
            </form>
        </div>
    </main>
</body>

</html>
