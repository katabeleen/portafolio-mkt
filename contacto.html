<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Katalina Alvarado</title>
    <!-- Vinculación del archivo CSS externo compartido -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Tipografía desde Google Fonts (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Librería AOS (Animate On Scroll) - Hoja de Estilos -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">
</head>

<body>

    <!-- CONTENEDOR CENTRAL DE CONTACTO (CARD ADAPTABLE) -->
    <!-- Solucionado con la guía de HTML/CSS: Formulario accesible con validación nativa -->
    <main class="card card-contact" data-aos="fade-up" data-aos-duration="800">

        <!-- 1. Encabezado y Menú de Navegación Común -->
        <header class="main-header">
            <nav class="nav-menu" aria-label="Navegación principal">
                <a href="index.html">Inicio</a>
                <a href="proyectos.html">Proyectos</a>
                <a href="contacto.html" class="active">Contacto</a>
            </nav>
        </header>

        <!-- 2. Sección del Formulario de Contacto -->
        <section class="contact-section">
            <h2 class="section-title">Contacto</h2>
            <p class="section-subtitle">¡Escríbeme un mensaje y nos pondremos en contacto a la brevedad para potenciar tu marca!</p>

            <form action="#" method="POST" class="contact-form" data-aos="fade-up" data-aos-delay="150">
                <div class="form-group">
                    <label for="username">Nombre Completo:</label>
                    <input type="text" id="username" name="username" placeholder="Ej. Juan Pérez" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje o propuesta aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" data-aos="zoom-in" data-aos-delay="250">
                    Enviar Mensaje &rarr;
                </button>
            </form>
        </section>

        <!-- 3. Pie de Página Semántico -->
        <footer class="main-footer">
            <p>&copy; 2024 Katalina Alvarado &bull; Portafolio Profesional</p>
        </footer>

    </main>

    <!-- Librería AOS (Animate On Scroll) - Script de Inicialización -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>

</body>

</html>
