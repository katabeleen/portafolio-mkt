<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Portafolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="card">
        <!-- Menú de navegación obligatorio -->
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <div class="contact-container">
            <h2>Contacto</h2>
            <p>¡Escríbeme un mensaje y me pondré en contacto a la brevedad!</p>

            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="username">Nombre Completo:</label>
                    <input type="text" id="username" name="username" placeholder="Ej. Katalina Alvarado" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..."
                        required></textarea>
                </div>

                <button type="submit" class="btn">Enviar Mensaje</button>
            </form>
        </div>
    </main>
</body>

</html>
